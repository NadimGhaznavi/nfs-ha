<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>disk-ha</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #11191c;
      color: #e5efed;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .masthead {
      padding: 1.2rem 2rem;
      background: #1a2a2e;
      border-bottom: 1px solid #345155;
    }
    .masthead h1 { margin: 0; font-size: 1.3rem; font-weight: 700; }
    .masthead a { color: #83d5c5; text-decoration: none; }
    .masthead p { margin: .35rem 0 0; font-size: .85rem; color: #adc5c4; }
    main { padding: 1.5rem 2rem; }
    .panel { border: 1px solid #345155; border-radius: .4rem; padding: 1rem 1.5rem; }
    .panel + .panel { margin-top: 1.5rem; }
    .health { overflow-x: auto; }
    .health th:not(:first-child), .health td { text-align: left; }
    .health td { overflow-wrap: anywhere; }
    h2 { font-size: 1.15rem; margin: 0 0 1rem; }
    button { background: #83d5c5; color: #11191c; border: 0; border-radius: .3rem;
             padding: .6rem 1rem; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .8rem; border-bottom: 1px solid #345155; }
    thead th { background: #1a2a2e; }
    tbody th { font-weight: 400; }
    td { font-variant-numeric: tabular-nums; }
    th:not(:first-child), td { text-align: right; }
    tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #1a2a2e; }
    :focus-visible { outline: 2px solid #83d5c5; outline-offset: 3px; }
    @media (max-width: 600px) {
      .masthead, main, .panel { padding: 1rem; }
      th, td { padding: .6rem .4rem; }
      .health table, .health tbody, .health tr, .health th, .health td { display: block; }
      .health thead { display: none; }
      .health tbody th { font-weight: 700; }
      .health tbody th, .health tbody td { border-bottom: 0; padding: .35rem 0; }
      .health tbody tr { padding: .75rem 0; border-bottom: 1px solid #345155; }
      .health tbody tr:last-child { border-bottom: 0; }
      .health td:nth-child(2)::before { content: "Health: "; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <h1><a href="/">disk-ha</a></h1>
    <p>Vigilent since <time datetime="2026-10">October 2026</time></p>
  </header>
  <main>
    <section class="panel" aria-labelledby="drive-heading">
      <h2 id="drive-heading">Drive Configuration</h2>
      <table>
        <thead><tr><th scope="col">Device</th><th scope="col">Capacity (TB)</th><th scope="col">Usage (TB)</th></tr></thead>
        <tbody>
          <tr><th scope="row">Disk 1</th><td>{{disk1_capacity}}</td><td>{{disk1_usage}}</td></tr>
          <tr><th scope="row">Disk 2</th><td>{{disk2_capacity}}</td><td>{{disk2_usage}}</td></tr>
        </tbody>
      </table>
    </section>
    <section class="panel health" aria-labelledby="health-heading">
      <h2 id="health-heading">Disk Health</h2>
      {{schedule}}
      {{health}}
    </section>
  </main>
  <script>
    const button = document.getElementById('run-now');
    if (button) button.addEventListener('click', async () => {
      const status = document.getElementById('run-status');
      button.disabled = true;
      status.textContent = 'Requesting health check…';
      try {
        const response = await fetch('/health/run', { method: 'POST' });
        status.textContent = await response.text();
      } catch (error) {
        status.textContent = 'Request failed. Reload the page and try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
